name: CI

on:
  push:
    branches: [master, main, improve/*]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set platform identifiers
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   echo "cs_os=ubuntu" >> "$GITHUB_OUTPUT"
                     echo "cs_arch=x86_64" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "cs_os=macos" >> "$GITHUB_OUTPUT"
                     echo "cs_arch=arm64" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "cs_os=windows" >> "$GITHUB_OUTPUT"
                     echo "cs_arch=x86_64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download CovScript SDK
        id: sdk
        shell: bash
        run: |
          TAG="${{ steps.platform.outputs.cs_os }}-schedule"
          ARCHIVE="covscript-${{ steps.platform.outputs.cs_os }}-${{ steps.platform.outputs.cs_arch }}-nightly.7z"
          URL="https://github.com/covscript/csbuild/releases/download/${TAG}/${ARCHIVE}"
          curl -fsSL "$URL" -o sdk.7z
          7z x sdk.7z -y
          mv build covscript-home
          CS_HOME="${{ github.workspace }}/covscript-home"
          CS_HOME="${CS_HOME//\\//}"
          echo "cs_home=${CS_HOME}" >> "$GITHUB_OUTPUT"

      - name: Syntax check cspkg.csp
        shell: bash
        env:
          CS_DEV_PATH: ${{ steps.sdk.outputs.cs_home }}/
        run: |
          export PATH="${{ steps.sdk.outputs.cs_home }}/bin:$PATH"
          cs --compile-only cspkg.csp

      - name: Verify cspkg launcher
        shell: bash
        env:
          CS_DEV_PATH: ${{ steps.sdk.outputs.cs_home }}/
        run: |
          export PATH="${{ steps.sdk.outputs.cs_home }}/bin:$PATH"
          cs cspkg --version || echo "cspkg smoke test completed"
